# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: tutordesk-backend
    runtime: node
    region: singapore # same region as the Neon database
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEON_DB_URL
        sync: false # paste the Neon connection string when asked
      - key: TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # websites allowed to call the API (mobile apps don't need this)
      # Email for OTPs: set these in the Render dashboard (Environment tab).
      # SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, MAIL_FROM, ADMIN_API_KEY
