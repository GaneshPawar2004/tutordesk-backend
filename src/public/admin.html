<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kaksha Admin</title>
<style>
  :root { --blue:#1a73e8; --red:#d93025; --yellow:#f9ab00; --green:#1e8e3e; --muted:#5f6368; --line:#e3e6ea; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0; color: #202124; background: #f6f8fb; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 19px; margin: 0; flex: 1; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid #c9ced6; border-radius: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; color: #fff; background: var(--blue); }
  button.green { background: var(--green); } button.red { background: var(--red); }
  button.ghost { background: #eef1f5; color: #202124; }
  button:disabled { opacity: .5; cursor: default; }
  #login { max-width: 380px; margin: 80px auto; }
  #login input { width: 100%; margin: 10px 0 14px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 220px; }
  .counts { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; color: var(--muted); border-top: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .b-trial { background: #fef7e0; color: #b06000; } .b-active { background: #e6f4ea; color: var(--green); }
  .b-blocked, .b-ended { background: #fce8e6; color: var(--red); }
  .actions { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
  .actions .row { display: flex; gap: 6px; }
  .actions select { flex: 1; padding: 6px; }
  #msg { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #202124; color: #fff;
         padding: 10px 16px; border-radius: 8px; display: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Kaksha Admin</h1>
  <button id="logout" class="ghost hidden">Sign out</button>
</header>

<div id="login" class="card">
  <h2 style="margin:0 0 4px">Sign in</h2>
  <div class="muted">Enter the admin key (ADMIN_API_KEY on the server).</div>
  <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
  <button id="signin" style="width:100%">Sign in</button>
</div>

<main id="panel" class="hidden">
  <div class="card">
    <div class="toolbar">
      <input id="q" placeholder="Search by tuition, owner name, email or mobile">
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <div id="counts" class="counts"></div>
    <table>
      <thead><tr><th>Tuition</th><th>Owner</th><th>Usage</th><th>Access</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<div id="msg"></div>
<script src="/admin.js"></script>
</body>
</html>
